name: AmirFacts CI

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: amirfacts-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile AmirFacts.py
      - name: Unit and source tests
        env:
          TELEGRAM_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-test.sqlite3
        run: |
          python - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          path = Path('AmirFacts.py')
          source = path.read_text(encoding='utf-8')
          assert 'infinity_polling' not in source
          spec = importlib.util.spec_from_file_location('facts', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules['facts'] = module
          spec.loader.exec_module(module)
          module.init_db()
          assert module.persian_only('این یک متن کاملاً فارسی برای آزمون است.')
          assert not module.persian_only('This is English text.')
          assert callable(module.source_wikipedia)
          assert callable(module.source_wikipedia_random)
          assert callable(module.source_wikidata_topic)
          assert callable(module.get_new_fact)
          key_a = module.fact_key('فکت تست', 'الف')
          key_b = module.fact_key('فکت تست', 'ب')
          assert key_a == key_b
          print('Core tests: PASS')
          PY
      - name: Live source tests
        env:
          TELEGRAM_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-live.sqlite3
        run: |
          python - <<'PY'
          import asyncio, importlib.util, sys
          from pathlib import Path
          path = Path('AmirFacts.py')
          spec = importlib.util.spec_from_file_location('live', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules['live'] = module
          spec.loader.exec_module(module)
          async def probe(coro):
              try:
                  value = await coro
                  return bool(value and module.usable(value[0]))
              except Exception as exc:
                  print(type(exc).__name__, exc)
                  return False
          async def main():
              async with module.aiohttp.ClientSession(timeout=module.TIMEOUT, headers={'User-Agent':'AmirFacts-CI/6.0'}) as session:
                  results = await asyncio.gather(
                      probe(module.source_wikipedia(session,'science')),
                      probe(module.source_wikipedia_random(session,'science')),
                      probe(module.source_wikidata_topic(session,'science')),
                      probe(module.source_football(session)),
                      probe(module.source_world_bank(session,'world')),
                      probe(module.source_usgs(session,'nature')),
                      probe(module.source_nasa(session,'space')),
                  )
              assert sum(results) >= 3, f'{sum(results)}/7 sources available'
              print(f'Live sources: {sum(results)}/7 PASS')
          asyncio.run(main())
          PY
      - name: Strong non-repeat and category tests
        env:
          TELEGRAM_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-e2e.sqlite3
        run: |
          python - <<'PY'
          import asyncio, importlib.util, sys
          from pathlib import Path
          path = Path('AmirFacts.py')
          spec = importlib.util.spec_from_file_location('e2e', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules['e2e'] = module
          spec.loader.exec_module(module)
          module.init_db()
          async def main():
              uid = 777001
              keys = set()
              for topic in ('science','science','science','science','technology','nature','history','space','world','football'):
                  value = await module.get_new_fact(uid, topic)
                  assert value is not None, f'empty result: {topic}'
                  assert module.usable(value[0])
                  assert value[1] == module.TOPIC_NAMES[topic]
                  assert value[3] not in keys, f'duplicate key: {topic}'
                  keys.add(value[3])
                  module.mark_seen(uid, value[3], value[2], value[1], value[0])
              assert module.seen_count(uid) == len(keys)
              print('10-request E2E: PASS')
              print('Repeated science: PASS')
              print('Cross-topic isolation: PASS')
          asyncio.run(main())
          PY
      - name: Runtime status
        run: echo "AmirFacts runtime is OFF by design."
