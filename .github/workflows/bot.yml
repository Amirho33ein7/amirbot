name: AmirBot Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Start a fresh run every 6 hours; each job is capped below GitHub's 6-hour limit.
    - cron: "0 */6 * * *"

concurrency:
  group: amirbot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate original Python syntax
        run: python -m py_compile AmirXProxy_single.py

      - name: Prepare fixed runtime and validate handlers
        run: python .github/prepare_runtime.py

      - name: Deep runtime self-tests
        env:
          AMIRXPROXY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$AMIRXPROXY_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN GitHub Secret is missing."
            exit 1
          fi

          python -m py_compile /tmp/AmirXProxy_single_fixed.py

          python - <<'PY'
          import asyncio
          import importlib.util
          import inspect
          import sys
          from pathlib import Path

          path = Path('/tmp/AmirXProxy_single_fixed.py')
          name = 'amirxproxy_deep_test'
          spec = importlib.util.spec_from_file_location(name, path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[name] = module
          spec.loader.exec_module(module)

          bot = module.build_bot()
          callback_handlers = list(getattr(bot, 'callback_query_handlers', []))
          message_handlers = list(getattr(bot, 'message_handlers', []))

          assert callback_handlers, 'No callback-query handlers registered.'
          assert message_handlers, 'No message handlers registered.'

          required_prefixes = ('qty:', 'refresh:')
          callback_sources = []
          for handler in callback_handlers:
              callback_sources.append(inspect.getsource(handler.get('function', lambda: None)))
          joined = '\n'.join(callback_sources)
          assert all(prefix in joined for prefix in required_prefixes), (
              f'Missing expected callback handlers: {required_prefixes}'
          )

          class FastSource:
              name = 'fast-test'
              async def collect(self):
                  return []

          class SlowSource:
              name = 'slow-test'
              async def collect(self):
                  await asyncio.sleep(10)
                  return []

          async def run_timeout_test():
              started = asyncio.get_running_loop().time()
              result = await module._bounded_collect_raw_candidates(
                  [FastSource(), SlowSource()], per_source_timeout=0.15
              )
              elapsed = asyncio.get_running_loop().time() - started
              assert result == [], f'Unexpected fake-source result: {result!r}'
              assert elapsed < 1.5, f'Bounded collector took too long: {elapsed:.2f}s'

          asyncio.run(run_timeout_test())

          many = [
              module.Proxy(
                  server=f"candidate-{i}.invalid",
                  port=443,
                  scheme=module.ProxyScheme.SOCKS5,
              )
              for i in range(5000)
          ]
          selected = module._cap_validation_candidates(many)
          assert len(selected) == 96, f'Validation cap failed: {len(selected)}'

          print('Deep runtime self-tests OK.')
          print(f'Callback handlers: {len(callback_handlers)}')
          print(f'Message handlers: {len(message_handlers)}')
          print('Bounded collector timeout test: PASS')
          print('5000 -> 96 validation-cap test: PASS')
          PY

      - name: Smoke-test bot construction
        env:
          AMIRXPROXY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$AMIRXPROXY_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN GitHub Secret is missing."
            exit 1
          fi
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          path = Path('/tmp/AmirXProxy_single_fixed.py')
          name = 'amirxproxy_smoke'
          spec = importlib.util.spec_from_file_location(name, path)
          module = importlib.util.module_from_spec(spec)
          sys.modules[name] = module
          spec.loader.exec_module(module)
          bot = module.build_bot()
          print('Smoke test OK: build_bot() completed without exception.')
          print(f'Callback handlers: {len(getattr(bot, "callback_query_handlers", []))}')
          print(f'Message handlers: {len(getattr(bot, "message_handlers", []))}')
          PY

      - name: Verify Telegram API and reset webhook
        env:
          AMIRXPROXY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get('AMIRXPROXY_BOT_TOKEN', '')
          if not token:
              raise SystemExit('Telegram token secret is empty.')

          base = f'https://api.telegram.org/bot{token}'

          def call(method, params=None):
              url = f'{base}/{method}'
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.load(response)
              if not data.get('ok'):
                  raise SystemExit(f'{method} failed: {data}')
              return data

          me = call('getMe')['result']
          print(f'Telegram API OK: @{me.get("username", "unknown")}')

          webhook = call('getWebhookInfo')['result']
          current_url = webhook.get('url', '')
          if current_url:
              print('Webhook detected; removing it before polling.')
          else:
              print('No webhook configured; polling can start directly.')

          deleted = call('deleteWebhook', {'drop_pending_updates': 'false'})
          print(f'Webhook reset OK: {deleted.get("result")}')

          final_webhook = call('getWebhookInfo')['result']
          if final_webhook.get('url'):
              raise SystemExit('Webhook is still configured after deleteWebhook.')
          print('Telegram polling preflight OK.')
          PY

      - name: Run Telegram bot
        env:
          AMIRXPROXY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python /tmp/AmirXProxy_single_fixed.py
