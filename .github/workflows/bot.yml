name: AmirFacts CI

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: amirfacts-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile
        env:
          AMIRXPROXY_BOT_TOKEN: "000000:CI_TEST_TOKEN"
        run: python -m py_compile AmirFacts.py

      - name: Static and unit tests
        env:
          AMIRXPROXY_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-test.sqlite3
        run: |
          python - <<'PY'
          import asyncio
          import importlib.util
          import sys
          from pathlib import Path

          path = Path('AmirFacts.py')
          spec = importlib.util.spec_from_file_location('amirfacts_test', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules['amirfacts_test'] = module
          spec.loader.exec_module(module)

          module.init_db()

          # Persian-only gate must reject English-only output.
          assert not module.persian_only('This is an English sentence about space.')
          assert module.persian_only('این یک جمله فارسی درباره فضا و ستاره‌ها است.')
          assert not module.usable('This is an English sentence about football and history.')
          assert module.usable('اولین دوره جام جهانی فوتبال در سال ۱۹۳۰ در اروگوئه برگزار شد و تاریخ مهمی در فوتبال است.')

          # Strong normalization/no-repeat test.
          key1 = module.fact_key('Hello   World', 'SRC')
          key2 = module.fact_key('hello world', 'src')
          assert key1 == key2
          module.mark_seen(1, key1, 'SRC', 'test')
          assert module.has_seen(1, key2)
          assert module.seen_count(1) == 1

          # Callback coverage, including football.
          kb = module.keyboard()
          callbacks = {btn.callback_data for row in kb.keyboard for btn in row}
          required = {'fact:new','fact:football','fact:space','fact:science','fact:technology','fact:nature','fact:history','fact:world','stats'}
          assert required.issubset(callbacks), required - callbacks
          assert len(module.bot.message_handlers) >= 3
          assert len(module.bot.callback_query_handlers) >= 3

          print('Static/unit tests: PASS')
          print('Persian-only gate: PASS')
          print('No-repeat/SQLite test: PASS')
          print('Football button coverage: PASS')
          PY

      - name: Live source tests
        env:
          AMIRXPROXY_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-live.sqlite3
        run: |
          python - <<'PY'
          import asyncio
          import importlib.util
          import sys
          from pathlib import Path

          path = Path('AmirFacts.py')
          spec = importlib.util.spec_from_file_location('amirfacts_live', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules['amirfacts_live'] = module
          spec.loader.exec_module(module)

          async def one(label, coro):
              try:
                  value = await coro
                  if value is None:
                      print(f'{label}: NO_DATA')
                      return False
                  text, category, source, key = value
                  assert module.usable(text), f'{label}: non-Persian/invalid text: {text!r}'
                  assert source and len(key) == 64
                  print(f'{label}: PASS | {source} | {category}')
                  return True
              except Exception as exc:
                  print(f'{label}: FAIL | {type(exc).__name__}: {exc}')
                  return False

          async def main():
              async with module.aiohttp.ClientSession(timeout=module.TIMEOUT, headers={'User-Agent':'AmirFacts-CI/1.0'}) as s:
                  results = await asyncio.gather(
                      one('Persian Wikipedia', module.wikipedia(s, 'science')),
                      one('Football Wikidata', module.wikidata_football(s)),
                      one('World Bank', module.world_bank(s)),
                      one('USGS', module.usgs(s)),
                      one('NASA', module.nasa(s)),
                  )
              # A transient public endpoint outage must not fail the build,
              # but at least three independent sources must be reachable.
              assert sum(results) >= 3, f'Only {sum(results)}/5 live sources passed'
              print(f'Live source coverage: {sum(results)}/5 PASS')

          asyncio.run(main())
          PY

      - name: End-to-end fact selection test
        env:
          AMIRXPROXY_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-e2e.sqlite3
        run: |
          python - <<'PY'
          import asyncio
          import importlib.util
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('amirfacts_e2e', Path('AmirFacts.py'))
          module = importlib.util.module_from_spec(spec)
          sys.modules['amirfacts_e2e'] = module
          spec.loader.exec_module(module)
          module.init_db()

          async def main():
              uid = 1122334455
              football = await module.get_new_fact(uid, 'football')
              assert football is not None, 'Football fact was not produced'
              assert football[1] == 'فوتبال'
              assert module.usable(football[0])
              module.mark_seen(uid, football[3], football[2], football[1])
              assert module.has_seen(uid, football[3])

              second = await module.get_new_fact(uid, 'football')
              assert second is None or second[3] != football[3], 'Duplicate football fact returned'
              if second:
                  assert module.usable(second[0])

              general = await module.get_new_fact(uid)
              assert general is not None
              assert module.usable(general[0])
              print('Football E2E test: PASS')
              print('No-duplicate E2E test: PASS')
              print('General fact E2E test: PASS')

          asyncio.run(main())
          PY

      - name: Telegram API preflight only
        env:
          AMIRXPROXY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$AMIRXPROXY_BOT_TOKEN"
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          token = os.environ['AMIRXPROXY_BOT_TOKEN']
          base = f'https://api.telegram.org/bot{token}'
          with urllib.request.urlopen(base + '/getMe', timeout=30) as r:
              data = json.load(r)
          assert data.get('ok'), data
          print(f"Telegram API preflight: PASS (@{data['result'].get('username','unknown')})")
          PY

      - name: Bot runtime status
        run: |
          echo "AmirFacts bot polling is OFF by design."
          echo "CI validates the code but does not start the Telegram polling loop."
