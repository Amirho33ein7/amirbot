name: AmirBot Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Start a fresh run every 6 hours; each job is capped below GitHub's 6-hour limit.
    - cron: "0 */6 * * *"

concurrency:
  group: amirbot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate original Python syntax
        run: python -m py_compile AmirXProxy_single.py

      - name: Prepare fixed runtime and validate handlers
        run: python .github/prepare_runtime.py

      - name: Smoke-test bot construction
        env:
          AMIRXPROXY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$AMIRXPROXY_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN GitHub Secret is missing."
            exit 1
          fi
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('/tmp/AmirXProxy_single_fixed.py')
          spec = importlib.util.spec_from_file_location('amirxproxy_smoke', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          bot = module.build_bot()
          print('Smoke test OK: build_bot() completed without exception.')
          print(f'Handler backends: {len(getattr(bot, "handlers", {}))}')
          PY

      - name: Run Telegram bot
        env:
          AMIRXPROXY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python /tmp/AmirXProxy_single_fixed.py
