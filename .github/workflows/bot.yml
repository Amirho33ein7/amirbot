name: AmirFacts CI

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: amirfacts-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile AmirFacts.py
      - name: Core and reserve integrity
        env:
          TELEGRAM_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-core.sqlite3
        run: |
          python - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          p=Path('AmirFacts.py'); s=p.read_text(encoding='utf-8')
          assert 'infinity_polling' not in s
          spec=importlib.util.spec_from_file_location('facts',p); m=importlib.util.module_from_spec(spec); sys.modules['facts']=m; spec.loader.exec_module(m)
          m.init_db()
          assert set(m.TOPICS)=={'new','space','science','technology','nature','history','football','world'}
          assert m.persian_only('این یک متن کاملاً فارسی برای آزمون است.') and not m.persian_only('This is English text.')
          assert m.fact_key('فکت تست','الف')==m.fact_key('فکت تست','ب')
          assert m.similarity_score('این یک فکت علمی درباره سلول و زیست شناسی است.','این یک فکت علمی درباره سلول و زیست شناسی است.')==1.0
          total=0
          for topic,facts in m.FALLBACK_BANK.items():
              assert len(facts)>=20, f'{topic}: raw reserve too small'
              assert len(facts)==len(set(facts)), f'{topic}: duplicate reserve text'
              usable=[x for x in facts if m.usable(x)]
              assert len(usable)>=18, f'{topic}: only {len(usable)} usable reserve facts'
              for x in usable:
                  if topic!='new': assert m.is_relevant(x,topic), f'{topic}: irrelevant reserve'
              total += len(usable)
          all_text=[x[1] for x in m.FALLBACK_FACTS]
          assert len(all_text)==len(set(all_text)), 'cross-topic duplicate reserve'
          print('Effective offline reserve:', total)
          print('Core + reserve integrity: PASS')
          PY
      - name: Live sources informational probe
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-live.sqlite3
        run: |
          python - <<'PY'
          import asyncio, importlib.util, sys
          from pathlib import Path
          p=Path('AmirFacts.py'); spec=importlib.util.spec_from_file_location('live',p); m=importlib.util.module_from_spec(spec); sys.modules['live']=m; spec.loader.exec_module(m)
          async def main():
              async with m.aiohttp.ClientSession(timeout=m.TIMEOUT) as s:
                  tests=[m.source_wikipedia(s,'science'),m.source_wikipedia_random(s,'science'),m.source_wikidata_topic(s,'science'),m.source_football(s),m.source_world_bank(s,'world'),m.source_usgs(s,'nature'),m.source_nasa(s,'space')]
                  r=[]
                  for c in tests:
                      try:
                          v=await c; r.append(bool(v and m.usable(v[0])))
                      except Exception: r.append(False)
                  print(f'Live source availability: {sum(r)}/7')
          asyncio.run(main())
          PY
      - name: Full offline dedup stress
        env:
          TELEGRAM_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-stress.sqlite3
        run: |
          python - <<'PY'
          import asyncio, importlib.util, sys
          from pathlib import Path
          p=Path('AmirFacts.py'); spec=importlib.util.spec_from_file_location('stress',p); m=importlib.util.module_from_spec(spec); sys.modules['stress']=m; spec.loader.exec_module(m); m.init_db()
          async def off(*a,**k): return None
          m.source_wikipedia=m.source_wikipedia_random=m.source_wikidata_topic=off; m.source_football=m.source_nasa=m.source_world_bank=m.source_usgs=off
          async def main():
              uid=881234; seen=[]; total=0
              for topic in m.TOPICS:
                  cap=[x for x in m.FALLBACK_BANK[topic] if m.usable(x)]
                  local=set()
                  for i in range(len(cap)):
                      v=await m.get_new_fact(uid,topic); assert v is not None, f'CUTOFF {topic} #{i+1}'
                      text,cat,src,key=v; assert m.usable(text) and cat==m.TOPIC_NAMES[topic] and key==m.fact_key(text)
                      assert key not in local and key not in {k for k,_ in seen}, f'duplicate {topic}'
                      if topic!='new': assert m.is_relevant(text,topic)
                      assert all(m.similarity_score(text,old)<0.84 for _,old in seen[-160:]), f'near duplicate {topic}'
                      local.add(key); seen.append((key,text)); m.mark_seen(uid,key,src,cat,text)
                  total += len(cap)
              assert m.seen_count(uid)==total
              print(f'Offline stress: {total} unique requests PASS')
              print('All-topic continuity + exact dedup + near-duplicate rejection + cross-topic isolation: PASS')
          asyncio.run(main())
          PY
      - name: Post-reserve live recovery
        env:
          TELEGRAM_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-recovery.sqlite3
        run: |
          python - <<'PY'
          import asyncio, importlib.util, sys
          from pathlib import Path
          p=Path('AmirFacts.py'); spec=importlib.util.spec_from_file_location('recovery',p); m=importlib.util.module_from_spec(spec); sys.modules['recovery']=m; spec.loader.exec_module(m); m.init_db()
          async def off(*a,**k): return None
          m.source_wikipedia_random=m.source_wikidata_topic=m.source_nasa=m.source_world_bank=m.source_usgs=off
          async def main():
              uid=445566
              for topic in m.TOPICS:
                  for text in m.FALLBACK_BANK[topic]:
                      if m.usable(text): m.mark_seen(uid,m.fact_key(text),f'reserve {topic}',m.TOPIC_NAMES[topic],text)
              counters={t:0 for t in m.TOPICS}
              async def live(session,topic):
                  counters[topic]+=1
                  text=f"فکت زنده آزمون {m.TOPIC_NAMES[topic]} شماره {counters[topic]} که مستقل از بانک پشتیبان برای بررسی ادامه‌دار بودن منبع زنده تولید شده است."
                  return text,m.TOPIC_NAMES[topic],'منبع زنده آزمون',m.fact_key(text)
              m.source_wikipedia=m.source_football=live
              for topic in m.TOPICS:
                  v=await m.get_new_fact(uid,topic); assert v is not None, f'POST-RESERVE CUTOFF {topic}'
                  text,cat,src,key=v; assert cat==m.TOPIC_NAMES[topic] and src=='منبع زنده آزمون' and not m.is_user_duplicate(uid,text)
                  m.mark_seen(uid,key,src,cat,text)
              print('Post-reserve live recovery: PASS')
          asyncio.run(main())
          PY
      - name: Mixed long-run stress
        env:
          TELEGRAM_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-mixed.sqlite3
        run: |
          python - <<'PY'
          import asyncio, importlib.util, sys
          from pathlib import Path
          p=Path('AmirFacts.py'); spec=importlib.util.spec_from_file_location('mixed',p); m=importlib.util.module_from_spec(spec); sys.modules['mixed']=m; spec.loader.exec_module(m); m.init_db()
          async def off(*a,**k): return None
          m.source_wikipedia=m.source_wikipedia_random=m.source_wikidata_topic=m.source_football=m.source_nasa=m.source_world_bank=m.source_usgs=off
          async def main():
              uid=991122; keys=set(); order=['science','technology','nature','history','space','world','football','new']*10
              for i,topic in enumerate(order,1):
                  v=await m.get_new_fact(uid,topic); assert v is not None, f'mixed CUTOFF #{i} {topic}'
                  text,cat,src,key=v; assert m.usable(text) and cat==m.TOPIC_NAMES[topic] and key not in keys
                  keys.add(key); m.mark_seen(uid,key,src,cat,text)
              assert len(keys)==len(order); print(f'Mixed long-run: {len(order)} sequential requests PASS')
          asyncio.run(main())
          PY
      - name: Runtime status
        run: echo "AmirFacts runtime is OFF by design."
