name: AmirFacts Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: amirfacts-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate Python syntax
        env:
          AMIRXPROXY_BOT_TOKEN: "000000:CI_TEST_TOKEN"
        run: python -m py_compile AmirFacts.py

      - name: Deep AmirFacts self-tests
        env:
          AMIRXPROXY_BOT_TOKEN: "000000:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-test.sqlite3
        run: |
          python - <<'PY'
          import asyncio
          import importlib.util
          import sqlite3
          import sys
          from pathlib import Path

          path = Path('AmirFacts.py')
          spec = importlib.util.spec_from_file_location('amirfacts_test', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules['amirfacts_test'] = module
          spec.loader.exec_module(module)

          module.init_db()
          module.mark_seen(1, module.fact_key('Hello   World', 'SRC'), 'SRC', 'test')
          assert module.has_seen(1, module.fact_key('hello world', 'src'))
          assert module.clean_text('[۱۲۳] hello   world') == 'hello world'

          keyboard = module.make_keyboard()
          callbacks = {btn.callback_data for row in keyboard.keyboard for btn in row}
          required = {
              'fact:new', 'fact:space', 'fact:science', 'fact:technology',
              'fact:nature', 'fact:history', 'fact:world', 'stats'
          }
          assert required.issubset(callbacks), f'Missing callbacks: {required - callbacks}'

          async def run_tests():
              result = await module.fetch_fact_from_sources('science')
              assert result is not None, 'No live-source fact returned'
              text, title, url, key = result
              assert module.usable_fact(text)
              assert title and url.startswith('http') and len(key) == 64

              uid = 246813579
              first = await module.get_new_fact(uid, 'space')
              assert first is not None
              module.mark_seen(uid, first[3], first[2], first[1])
              assert module.has_seen(uid, first[3])

          asyncio.run(run_tests())
          assert len(module.bot.message_handlers) >= 3
          assert len(module.bot.callback_query_handlers) >= 3

          print('AmirFacts deep self-tests: PASS')
          print(f'Message handlers: {len(module.bot.message_handlers)}')
          print(f'Callback handlers: {len(module.bot.callback_query_handlers)}')
          print('Live multi-source network test: PASS')
          print('SQLite no-repeat test: PASS')
          print('Keyboard coverage test: PASS')
          print('Hash normalization test: PASS')
          PY

      - name: Telegram API preflight
        env:
          AMIRXPROXY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$AMIRXPROXY_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN GitHub Secret is missing."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ['AMIRXPROXY_BOT_TOKEN']
          base = f'https://api.telegram.org/bot{token}'

          def call(method, params=None):
              url = base + '/' + method
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.load(response)
              if not data.get('ok'):
                  raise SystemExit(f'{method} failed: {data}')
              return data['result']

          me = call('getMe')
          print(f'Telegram API OK: @{me.get("username", "unknown")}')
          call('deleteWebhook', {'drop_pending_updates': 'false'})
          info = call('getWebhookInfo')
          assert not info.get('url'), f'Webhook still active: {info.get("url")}'
          print('Telegram polling preflight: PASS')
          PY

      - name: Run AmirFacts bot
        env:
          AMIRXPROXY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python AmirFacts.py
