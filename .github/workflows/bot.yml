name: AmirFacts Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: amirfacts-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate Python syntax
        env:
          AMIRXPROXY_BOT_TOKEN: "123456:CI_TEST_TOKEN"
        run: python -m py_compile AmirXProxy_single.py

      - name: Deep AmirFacts self-tests
        env:
          AMIRXPROXY_BOT_TOKEN: "123456:CI_TEST_TOKEN"
          AMIRFACTS_DB: /tmp/amirfacts-test.sqlite3
        run: |
          python - <<'PY'
          import asyncio
          import importlib.util
          import sys
          from pathlib import Path

          path = Path('AmirXProxy_single.py')
          spec = importlib.util.spec_from_file_location('amirfacts_test', path)
          module = importlib.util.module_from_spec(spec)
          sys.modules['amirfacts_test'] = module
          spec.loader.exec_module(module)

          assert module.fact_key('Hello   world', 'src') == module.fact_key('hello world', 'src')
          assert len(module.clean_extract('[۱۲۳] ' + 'x' * 1000)) <= module.MAX_FACT_LENGTH

          keyboard = module.make_keyboard()
          callbacks = [btn.callback_data for row in keyboard.keyboard for btn in row]
          required = {'fact:new', 'fact:space', 'fact:science', 'fact:technology', 'fact:nature', 'fact:history', 'stats'}
          assert required.issubset(set(callbacks)), 'Missing expected buttons'

          async def run_tests():
              result = await module.fetch_wikipedia_fact('science')
              assert result is not None, 'Wikipedia source returned no usable fact'
              text, title, url = result
              assert text and title and url.startswith('https://fa.wikipedia.org/')
              assert len(text) >= 90

              user_id = 987654321
              got = await module.get_new_fact(user_id, topic='space')
              assert got is not None, 'Could not obtain first fact'
              module.mark_seen(user_id, got[3])
              assert module.has_seen(user_id, got[3])

          asyncio.run(run_tests())

          assert len(module.bot.message_handlers) >= 3
          assert len(module.bot.callback_query_handlers) >= 3

          print('AmirFacts deep self-tests: PASS')
          print(f'Message handlers: {len(module.bot.message_handlers)}')
          print(f'Callback handlers: {len(module.bot.callback_query_handlers)}')
          print('Wikipedia network test: PASS')
          print('SQLite no-repeat test: PASS')
          print('Keyboard coverage test: PASS')
          print('Hash normalization test: PASS')
          PY

      - name: Telegram API preflight
        env:
          AMIRXPROXY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$AMIRXPROXY_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN GitHub Secret is missing."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ['AMIRXPROXY_BOT_TOKEN']
          base = f'https://api.telegram.org/bot{token}'

          def call(method, params=None):
              url = base + '/' + method
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.load(response)
              if not data.get('ok'):
                  raise SystemExit(f'{method} failed: {data}')
              return data['result']

          me = call('getMe')
          print(f'Telegram API OK: @{me.get("username", "unknown")}')
          call('deleteWebhook', {'drop_pending_updates': 'false'})
          info = call('getWebhookInfo')
          assert not info.get('url'), f'Webhook still active: {info.get("url")}'
          print('Telegram polling preflight: PASS')
          PY

      - name: Run AmirFacts bot
        env:
          AMIRXPROXY_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python AmirXProxy_single.py
